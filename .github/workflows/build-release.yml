name: Build and Release

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 release artifacts
        run: npm run build:win:x64 -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: release/
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  build-linux-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux deb artifact
        run: npm run build:linux:deb -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-release
          path: release/*.deb
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.deb
          fail_on_unmatched_files: true

  build-linux-flatpak:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Linux Flatpak artifact
        run: |
          flatpak-builder \
            --install-deps-from=flathub \
            --force-clean \
            --user \
            --repo=flatpak-repo \
            flatpak-build-dir \
            gkiokan.net.ps4remotepkgsenderv2.yml

      - name: Bundle Flatpak
        run: |
          mkdir -p release
          flatpak build-bundle flatpak-repo \
            release/ps4-remote-pkg-sender.flatpak \
            gkiokan.net.ps4remotepkgsenderv2

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-release
          path: release/*.flatpak
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.flatpak
          fail_on_unmatched_files: true
