app-id: gkiokan.net.ps4remotepkgsenderv2
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: run.sh
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_TRASH=gio
build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: ps4-remote-pkg-sender
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/ps4-remote-pkg-sender/flatpak-node/cache
        npm_config_cache: /run/build/ps4-remote-pkg-sender/flatpak-node/npm-cache
        npm_config_offline: 'true'
        electron_config_cache: /run/build/ps4-remote-pkg-sender/flatpak-node/cache
    build-commands:
      # Install the app
      - test -d release/linux-unpacked || (echo "Missing release/linux-unpacked directory. Ensure the unpacked Linux build is created before Flatpak packaging." >&2; exit 1)
      - cp -a release/linux-unpacked /app/main
      # Install the launcher wrapper
      - install -Dm755 -t /app/bin/ run.sh
      # build/icon.png (512x512) is committed to the repository
      - install -Dm644 build/icon.png /app/share/icons/hicolor/512x512/apps/gkiokan.net.ps4remotepkgsenderv2.png
      # build/gkiokan.net.ps4remotepkgsenderv2.desktop is committed to the repository
      - install -Dm644 build/gkiokan.net.ps4remotepkgsenderv2.desktop /app/share/applications/gkiokan.net.ps4remotepkgsenderv2.desktop
    sources:
      # The CI workflow creates release/linux-unpacked before invoking flatpak-builder,
      # and this repository source includes that prebuilt app directory for packaging.
      - type: dir
        path: .
      - type: script
        dest-filename: run.sh
        commands:
          # The executable name matches the `name` field in package.json (PS4RemotePKGSenderV2).
          # Verify against the actual electron-builder --dir output if the launch fails.
          - zypak-wrapper.sh /app/main/PS4RemotePKGSenderV2 "$@"
